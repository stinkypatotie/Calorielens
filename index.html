<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>CalorieLens</title>
<style>
:root{--bg:#faf8f4;--card:#fff;--text:#1f2a24;--muted:#6b756f;--accent:#2f7d4f;--accent-t:#fff;--line:#e6e2d9;--warn:#b45309;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#141916;--card:#1d241f;--text:#eef2ee;--muted:#9aa6a0;--accent:#5bbf85;--accent-t:#0e1a12;--line:#2b342e;--warn:#f59e0b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;justify-content:space-between;align-items:center}
h1{font-size:1.5rem;margin:0}
.sub{color:var(--muted);margin:2px 0 18px}
.gear{background:none;border:0;font-size:1.4rem;width:auto;padding:4px 8px;color:var(--text);cursor:pointer}
.drop{display:block;border:2px dashed var(--line);border-radius:16px;background:var(--card);padding:28px 16px;text-align:center;cursor:pointer}
.drop strong{display:block}.drop span{color:var(--muted);font-size:.9rem}
input[type=file]{display:none}
#pv{display:none;width:100%;max-height:340px;object-fit:cover;border-radius:16px;margin-bottom:12px}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--accent);color:var(--accent-t);font-weight:600;cursor:pointer;width:100%}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);margin-top:8px}
button:disabled{opacity:.5}
input[type=password],input[type=text]{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);margin:8px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:16px}
.total{font-size:2.6rem;font-weight:700;line-height:1}.total small{font-size:1rem;color:var(--muted);font-weight:500}
.macros{display:flex;gap:8px;margin-top:12px}
.macros div{flex:1;background:var(--bg);border-radius:10px;padding:8px;text-align:center;font-size:.8rem;color:var(--muted)}
.macros b{display:block;color:var(--text);font-size:1.05rem}
.item{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}.item small{color:var(--muted);display:block}.item .k{font-weight:600;white-space:nowrap}
.note{color:var(--muted);font-size:.8rem;margin-top:12px}
.err{color:var(--warn)}
.portion{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:.9rem;color:var(--muted)}
.portion input{flex:1}
#settings{display:none}
</style>
</head>
<body>
<main>
  <header>
    <h1>🥗 CalorieLens</h1>
    <button class="gear" id="gear" aria-label="Settings">⚙️</button>
  </header>
  <p class="sub">Snap or upload a photo of your food for a calorie estimate.</p>

  <div class="card" id="settings" style="margin-top:0;margin-bottom:16px">
    <strong>Gemini API key (free)</strong>
    <div class="note" style="margin-top:2px">Stored only in this browser. Get a free key at aistudio.google.com/app/apikey.</div>
    <input type="password" id="key" placeholder="AIza..." autocomplete="off">
    <input type="text" id="model" placeholder="Model" value="gemini-2.5-flash">
    <button id="save">Save</button>
  </div>

  <img id="pv" alt="Food preview">
  <label class="drop" id="drop" for="file"><strong>Tap to upload or take a photo</strong><span>JPG, PNG, WebP or HEIC</span></label>
  <input id="file" type="file" accept="image/*">

  <button id="go" style="margin-top:12px;display:none">Estimate calories</button>
  <button id="reset" class="ghost" style="display:none">Choose another photo</button>
  <div id="status" class="note"></div>
  <div id="out"></div>
</main>

<script>
const $ = id => document.getElementById(id);
const store = {
  get(k){ try{ return localStorage.getItem(k) || ""; }catch(e){ return ""; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};
let file = null, result = null, scale = 1;

$("key").value = store.get("cl_key");
if(store.get("cl_model")) $("model").value = store.get("cl_model");
if(!store.get("cl_key")) $("settings").style.display = "block";
$("gear").onclick = () => { const s=$("settings"); s.style.display = s.style.display==="block" ? "none" : "block"; };
$("save").onclick = () => {
  store.set("cl_key", $("key").value.trim());
  store.set("cl_model", $("model").value.trim() || "gemini-2.5-flash");
  $("settings").style.display = "none"; $("status").textContent = "Saved.";
};

$("file").addEventListener("change", e => {
  file = e.target.files[0]; if(!file) return;
  $("pv").src = URL.createObjectURL(file); $("pv").style.display = "block";
  $("drop").style.display = "none"; $("go").style.display = "block"; $("reset").style.display = "block";
  $("out").innerHTML = ""; $("status").textContent = ""; result = null;
});
$("reset").onclick = () => {
  file = null; result = null; $("file").value = "";
  $("pv").style.display = "none"; $("drop").style.display = "block";
  $("go").style.display = "none"; $("reset").style.display = "none";
  $("out").innerHTML = ""; $("status").textContent = "";
};

function toJpegBase64(f, max=1280){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(f), im = new Image();
    im.onload = () => {
      const k = Math.min(1, max / Math.max(im.width, im.height));
      const c = document.createElement("canvas");
      c.width = Math.round(im.width*k); c.height = Math.round(im.height*k);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg",0.85).split(",")[1]);
    };
    im.onerror = () => rej(new Error("decode"));
    im.src = url;
  });
}

const PROMPT = `The attached image is a photo of a meal or food item. Always give your best estimate: identify each distinct food item, guess a typical portion from visual cues (plate, utensils, hand, container size), and estimate nutrition using typical values. Never refuse because details are unclear; just lower the confidence. Respond ONLY with JSON, no markdown:
{"is_food":boolean,"dish":"short name","items":[{"name":"","portion":"e.g. 1 cup / ~150 g","calories":number,"protein_g":number,"carbs_g":number,"fat_g":number}],"confidence":"low|medium|high","notes":"one short sentence on assumptions"}
Set is_food false only if the image clearly contains no food.`;

$("go").onclick = async () => {
  const key = store.get("cl_key");
  if(!key){ $("settings").style.display="block"; $("status").innerHTML='<span class="err">Add your API key first.</span>'; return; }
  $("go").disabled = true; $("out").innerHTML = ""; $("status").textContent = "Analyzing your meal…";
  try{
    const data = await toJpegBase64(file);
    const model = store.get("cl_model") || "gemini-2.5-flash";
    const r = await fetch("https://generativelanguage.googleapis.com/v1beta/models/" + encodeURIComponent(model) + ":generateContent", {
      method:"POST",
      headers:{"content-type":"application/json","x-goog-api-key":key},
      body: JSON.stringify({
        contents:[{parts:[
          {inline_data:{mime_type:"image/jpeg",data}},
          {text:PROMPT}
        ]}],
        generationConfig:{temperature:0.3, responseMimeType:"application/json"}
      })
    });
    const j = await r.json();
    if(!r.ok) throw new Error((j.error && j.error.message) || ("HTTP " + r.status));
    const cand = j.candidates && j.candidates[0];
    const txt = cand && cand.content && cand.content.parts ? cand.content.parts.map(p=>p.text||"").join("") : "";
    const m = txt.match(/\{[\s\S]*\}/);
    if(!m) throw new Error("Unexpected response format");
    result = JSON.parse(m[0]); scale = 1; render(); $("status").textContent = "";
  }catch(e){
    $("status").innerHTML = '<span class="err">' + esc(e.message === "decode" ? "This image couldn't be read. Try a JPG or PNG." : e.message) + '</span>';
  }finally{ $("go").disabled = false; }
};

function esc(s){ const d=document.createElement("div"); d.textContent=String(s??""); return d.innerHTML; }

function render(){
  const r = result;
  if(!r || !r.is_food || !r.items || !r.items.length){
    $("out").innerHTML = '<div class="card">No food items were returned. ' + esc(r && r.notes || "") + '</div>'; return;
  }
  const sum = k => Math.round(r.items.reduce((a,i)=>a+(Number(i[k])||0),0)*scale);
  $("out").innerHTML = `
    <div class="card">
      <div style="color:var(--muted)">${esc(r.dish)} · ${esc(r.confidence)} confidence</div>
      <div class="total">${sum("calories")} <small>kcal</small></div>
      <div class="macros">
        <div><b>${sum("protein_g")}g</b>Protein</div>
        <div><b>${sum("carbs_g")}g</b>Carbs</div>
        <div><b>${sum("fat_g")}g</b>Fat</div>
      </div>
      <div class="portion">Portion <input id="sc" type="range" min="0.25" max="3" step="0.25" value="${scale}"> <span>${scale}×</span></div>
    </div>
    <div class="card">
      ${r.items.map(i=>`<div class="item"><div>${esc(i.name)}<small>${esc(i.portion)}</small></div><div class="k">${Math.round((Number(i.calories)||0)*scale)} kcal</div></div>`).join("")}
    </div>
    <p class="note">${esc(r.notes)} Photo-based estimates are approximate and not medical or dietary advice.</p>`;
  $("sc").oninput = e => { scale = parseFloat(e.target.value); render(); };
}
</script>
</body>
</html>
